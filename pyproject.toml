[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voicedesk"
version = "0.1.0"
description = "Real-time voice support with appointment tools and interruptible speech"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents==1.8.10",
  "livekit-plugins-deepgram==1.8.10",
  "livekit-plugins-openai==1.8.10",
  "livekit-plugins-silero==1.8.10",
  "livekit-api==1.2.2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["voicedesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
